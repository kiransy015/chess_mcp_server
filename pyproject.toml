[project]
name = "mcp-build-chess-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mcpServer Commit", email = "kiran@gmail.coms" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]<2",
    "requests>=2.34.2",
]

[project.scripts]
chess = "mcp_build_chess_server.server:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

